[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "railui"
version = "0.1.0"
description = "A Python-first, zero-runtime fullstack web framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "watchdog>=4.0",
]

[project.scripts]
railui = "railui.cli.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["railui*"]
exclude = ["examples*", "tests*"]

[tool.setuptools.package-data]
"railui" = ["js/*.js", "templates/**/*"]

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
include = ["railui"]
exclude = ["examples", ".venv", "dist"]
reportMissingImports = true
reportMissingModuleSource = false

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="240" viewBox="0 0 400 240">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="rail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="240" fill="url(#bg)" rx="12"/>
  <!-- Decorative circles -->
  <circle cx="340" cy="40" r="60" fill="#ffffff" fill-opacity="0.06"/>
  <circle cx="60" cy="200" r="80" fill="#ffffff" fill-opacity="0.04"/>
  <!-- Rail tracks -->
  <rect x="0" y="110" width="400" height="4" rx="2" fill="url(#rail)"/>
  <rect x="0" y="126" width="400" height="4" rx="2" fill="url(#rail)"/>
  <!-- Sleepers -->
  <rect x="20"  y="106" width="6" height="28" rx="2" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="60"  y="106" width="6" height="28" rx="2" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="100" y="106" width="6" height="28" rx="2" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="140" y="106" width="6" height="28" rx="2" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="180" y="106" width="6" height="28" rx="2" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="220" y="106" width="6" height="28" rx="2" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="260" y="106" width="6" height="28" rx="2" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="300" y="106" width="6" height="28" rx="2" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="340" y="106" width="6" height="28" rx="2" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="374" y="106" width="6" height="28" rx="2" fill="#ffffff" fill-opacity="0.5"/>
  <!-- Logo text -->
  <text x="200" y="72" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">RailUI</text>
  <text x="200" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#ffffff" fill-opacity="0.8" text-anchor="middle" letter-spacing="4">FRAMEWORK</text>
  <!-- Tagline -->
  <text x="200" y="170" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#ffffff" fill-opacity="0.7" text-anchor="middle">Python-first · Zero-runtime · Reactive SPA</text>
  <!-- Badges -->
  <rect x="98" y="190" width="60" height="22" rx="11" fill="#ffffff" fill-opacity="0.15"/>
  <text x="128" y="205" font-family="system-ui" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">v0.1.3</text>
  <rect x="172" y="190" width="56" height="22" rx="11" fill="#10b981" fill-opacity="0.8"/>
  <text x="200" y="205" font-family="system-ui" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">ALPHA</text>
  <rect x="242" y="190" width="60" height="22" rx="11" fill="#ffffff" fill-opacity="0.15"/>
  <text x="272" y="205" font-family="system-ui" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="600">MIT</text>
</svg>
